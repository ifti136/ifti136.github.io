<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md. Iftekharul Islam | Portfolio</title>
    <meta
      name="description"
      content="Professional portfolio of Md. Iftekharul Islam, a student of Computer Science and Engineering."
    />
    <meta name="theme-color" content="#2b3ce8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Set the theme before first paint so the page never flashes the wrong colors. -->
    <script>
      (function () {
        var theme = "light";
        try {
          theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles/main.css" />

    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#site-main">Skip to content</a>
    <div id="progress" class="progress" aria-hidden="true"></div>
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>

    <header id="site-header" class="nav"></header>
    <main id="site-main" tabindex="-1">
      <noscript>
        <div class="container load-error">
          <h1>Md. Iftekharul Islam</h1>
          <p>This portfolio needs JavaScript to show its content.</p>
        </div>
      </noscript>
    </main>
    <footer id="site-footer" class="footer"></footer>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
